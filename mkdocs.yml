site_name: HotPot 技术知识库
site_url: https://anoec.github.io/hotpot/

copyright: Copyright &copy; 2026 HotPot Team, Sichuan University

repo_url: https://github.com/ANOEC/hotpot
repo_name: ANOEC/hotpot
edit_uri: edit/main/docs/

theme:
    logo: assets/rm.svg
    favicon: assets/rm.png

    icon:
        edit: material/pencil 
        view: material/eye

    features:
        - content.code.copy
        - content.code.annotate 
        - content.action.edit
        - content.action.view
      #   - navigation.instant
        # - navigation.sections
        - navigation.tabs
        - navigation.tabs.sticky
        - navigation.tracking
        - toc.follow
        - navigation.indexes
        #     - toc.integrate
        - navigation.top
        - header.autohide
        - navigation.expand
        
    custom_dir: overrides

    palette:
        # Palette toggle for light mode
        - scheme: default
          toggle:
              icon: material/lightbulb
              name: Switch to dark mode
        # Palette toggle for dark mode
        - scheme: slate
          toggle:
              icon: material/lightbulb-outline
              name: Switch to light mode

    name: material
    language: zh

markdown_extensions:
    - abbr
    - admonition
    - attr_list
    - def_list
    - footnotes
    - md_in_html
    - toc:
          slugify: !!python/object/apply:pymdownx.slugs.slugify
            kwds:
              case: lower
          permalink: true
          permalink_title: 链接到此节
          toc_depth: 4
    - tables
    - pymdownx.arithmatex:
          generic: true
    - pymdownx.betterem
    - pymdownx.details
    - pymdownx.caret
    - pymdownx.mark
    - pymdownx.tilde
    - pymdownx.critic
    - pymdownx.details
    - pymdownx.emoji:
          emoji_index: !!python/name:material.extensions.emoji.twemoji 
          emoji_generator: !!python/name:material.extensions.emoji.to_svg
          options:
             custom_icons:
                  - overrides/.icons
    - pymdownx.highlight:
          auto_title: true
          anchor_linenums: true
          linenums: true
    - pymdownx.inlinehilite
    - pymdownx.keys
    - pymdownx.smartsymbols
    - pymdownx.snippets
    - pymdownx.tabbed:
          alternate_style: true

    - pymdownx.tasklist:
          custom_checkbox: true

    - pymdownx.superfences:
          custom_fences:
              - name: mermaid
                class: mermaid
                format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
#   - javascripts/mathjax.js
#   - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

